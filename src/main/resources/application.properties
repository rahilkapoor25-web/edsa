spring.application.name=edsa

# H2 in a file under ./data, so accounts, imported data and recorded leave survive a restart.
# It used to be in memory, which wiped every account and every pending leave request each time
# the application stopped - a leave request nobody had reviewed yet was simply gone. The schema
# is written with CREATE TABLE IF NOT EXISTS and ALTER TABLE ... IF NOT EXISTS, so it reapplies
# harmlessly over an existing file.
#
# Moving to MySQL later is these four lines plus a driver dependency: every query is plain
# JDBC, so no Java changes. Tests override this with their own in-memory database, so each test
# class still starts from nothing.
spring.datasource.url=jdbc:h2:file:./data/edsa;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The schema is created on start-up. The H2 console stays off: it is a database shell.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.h2.console.enabled=false

# Keep the session id out of URLs and out of reach of scripts.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Errors show a page written for a coordinator. Nothing about the exception reaches the
# browser - no message, no stack trace, no binding detail - because none of it would help them
# and some of it would tell an attacker about the inside of the application.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# One workbook per upload, well under the import service's own limit.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=16MB

# The administrator account. Nothing happens unless all three are supplied, and there is no
# default password: set EDSA_SEEDADMIN_ENABLED, EDSA_SEEDADMIN_EMAIL and
# EDSA_SEEDADMIN_PASSWORD in the environment for a development machine. Never commit a password.
#
# On every start this creates that account if it is missing, and otherwise resets its password
# and re-enables it - which is how to get back in after forgetting it, now that the database
# survives restarts. Leave these unset in a real deployment: anybody who can set them could
# take the administrator account over. Provision real accounts through the Accounts page.
edsa.seed-admin.enabled=${EDSA_SEEDADMIN_ENABLED:false}
edsa.seed-admin.email=${EDSA_SEEDADMIN_EMAIL:}
edsa.seed-admin.password=${EDSA_SEEDADMIN_PASSWORD:}
edsa.seed-admin.display-name=${EDSA_SEEDADMIN_NAME:Administrator}

# Operating hours and the capacity assumed for a room whose own capacity is missing.
edsa.scheduling.day-start=09:00
edsa.scheduling.day-end=18:00
edsa.scheduling.turnaround-minutes=30
edsa.scheduling.fallback-room-capacity=30

# How long a recorded absence may wait for review before the Disruption page flags it as
# overdue. The deadline is only ever a prompt: nothing is approved automatically when it
# passes, and an unreviewed request keeps the duty roster exactly as it is.
edsa.leave.confirm-within-hours=24

# How long a professor's account-activation link stays valid. The link is single use, and the
# account cannot be signed into until its owner has set a password through it.
edsa.accounts.activation-valid-hours=168
