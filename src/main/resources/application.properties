spring.application.name=edsa

# H2 in-memory for now; MySQL replaces these four lines later.
spring.datasource.url=jdbc:h2:mem:edsa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The schema is created on start-up. The H2 console stays off: it is a database shell.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.h2.console.enabled=false

# Keep the session id out of URLs and out of reach of scripts.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# One workbook per upload, well under the import service's own limit.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=16MB

# The first administrator. Nothing is created unless all three are supplied, and there is no
# default password: set EDSA_SEEDADMIN_ENABLED, EDSA_SEEDADMIN_EMAIL and
# EDSA_SEEDADMIN_PASSWORD in the environment for a development machine. Never commit a password.
edsa.seed-admin.enabled=${EDSA_SEEDADMIN_ENABLED:false}
edsa.seed-admin.email=${EDSA_SEEDADMIN_EMAIL:}
edsa.seed-admin.password=${EDSA_SEEDADMIN_PASSWORD:}
edsa.seed-admin.display-name=${EDSA_SEEDADMIN_NAME:Administrator}

# Operating hours and the capacity assumed for a room whose own capacity is missing.
edsa.scheduling.day-start=09:00
edsa.scheduling.day-end=18:00
edsa.scheduling.turnaround-minutes=30
edsa.scheduling.fallback-room-capacity=30

# How long a recorded absence may wait for review before the Disruption page flags it as
# overdue. The deadline is only ever a prompt: nothing is approved automatically when it
# passes, and an unreviewed request keeps the duty roster exactly as it is.
edsa.leave.confirm-within-hours=24

# How long a professor's account-activation link stays valid. The link is single use, and the
# account cannot be signed into until its owner has set a password through it.
edsa.accounts.activation-valid-hours=168
