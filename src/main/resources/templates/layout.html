<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="page(pageTitle, activeTab, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · EDSA'">EDSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" th:href="@{/css/edsa.css}">
</head>
<body>

<!-- Signed out, there is nobody to name and nowhere to navigate, so the header carries the
     brand alone. -->
<header class="masthead">
    <div class="masthead__bar shell">
        <a class="brand" th:href="@{/}">
            <span class="brand__mark" aria-hidden="true"></span>
            <span class="brand__name">EDSA</span>
            <span class="brand__expansion">Exam Duty &amp; Seating Allocation</span>
        </a>
        <div class="session" sec:authorize="isAuthenticated()">
            <span class="session__user mono" sec:authentication="name">coordinator@example.edu</span>
            <form class="session__logout-form" method="post" th:action="@{/logout}">
                <button class="session__logout" type="submit">Log out</button>
            </form>
        </div>
    </div>

    <nav class="tabs" aria-label="Sections" sec:authorize="isAuthenticated()">
        <div class="tabs__inner shell">
            <a class="tab" th:classappend="${activeTab == 'data-and-run'} ? 'tab--active'"
               th:href="@{/}">Data and Run</a>
            <a class="tab" th:classappend="${activeTab == 'room-schedule'} ? 'tab--active'"
               th:href="@{/rooms}">Room schedule</a>
            <a class="tab" th:classappend="${activeTab == 'workloads'} ? 'tab--active'"
               th:href="@{/workloads}">Workloads</a>
            <a class="tab" th:classappend="${activeTab == 'disruption'} ? 'tab--active'"
               th:href="@{/disruption}">Disruption</a>
            <a class="tab" th:classappend="${activeTab == 'users'} ? 'tab--active'"
               th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Accounts</a>
        </div>
    </nav>
</header>

<main th:replace="${content}">
    <p>Page content goes here.</p>
</main>

<footer class="footer">
    <div class="shell footer__inner">
        <span>Automated Exam Duty &amp; Seating Allocation</span>
        <span class="mono footer__note">prototype</span>
    </div>
</footer>

<!-- Progressive enhancement, and nothing more. Every form here works with JavaScript turned
     off: this only asks before something destructive and stops an impatient second click
     sending the same import twice. There is no framework and no external script. -->
<script>
    (function () {
        document.addEventListener('submit', function (event) {
            var form = event.target;
            if (!(form instanceof HTMLFormElement)) {
                return;
            }

            var question = form.getAttribute('data-confirm');
            if (question && !window.confirm(question)) {
                event.preventDefault();
                return;
            }

            if (form.dataset.submitted === 'true') {
                event.preventDefault();
                return;
            }
            form.dataset.submitted = 'true';

            var busy = form.getAttribute('data-busy');
            var button = form.querySelector('button[type="submit"]');
            if (busy && button) {
                // After the current tick: disabling a button during its own submit event
                // cancels the submission in some browsers.
                window.setTimeout(function () {
                    button.disabled = true;
                    button.textContent = busy;
                }, 0);
            }
        });
    })();
</script>

</body>
</html>
