<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(pageTitle, activeTab, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · EDSA'">EDSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" th:href="@{/css/edsa.css}">
</head>
<body>

<!-- Signed out, there is nobody to name and nowhere to navigate, so the header carries the
     brand alone. -->
<header class="masthead">
    <div class="masthead__bar shell">
        <a class="brand" th:href="@{/}">
            <span class="brand__mark" aria-hidden="true"></span>
            <span class="brand__name">EDSA</span>
            <span class="brand__expansion">Exam Duty &amp; Seating Allocation</span>
        </a>
        <div class="session" th:if="${session.userEmail}">
            <span class="session__user mono" th:text="${session.userEmail}">coordinator@thapar.edu</span>
            <a class="session__logout" th:href="@{/logout}">Log out</a>
        </div>
    </div>

    <nav class="tabs" aria-label="Sections" th:if="${session.userEmail}">
        <div class="tabs__inner shell">
            <a class="tab" th:classappend="${activeTab == 'data-and-run'} ? 'tab--active'"
               th:href="@{/}">Data and Run</a>
            <span class="tab tab--soon" title="Not built yet">Import</span>
            <span class="tab tab--soon" title="Not built yet">Solve</span>
            <span class="tab tab--soon" title="Not built yet">Plan viewer</span>
            <span class="tab tab--soon" title="Not built yet">Disruption</span>
            <span class="tab tab--soon" title="Not built yet">Reports</span>
        </div>
    </nav>
</header>

<main th:replace="${content}">
    <p>Page content goes here.</p>
</main>

<footer class="footer">
    <div class="shell footer__inner">
        <span>Automated Exam Duty &amp; Seating Allocation</span>
        <span class="mono footer__note">prototype</span>
    </div>
</footer>

</body>
</html>
