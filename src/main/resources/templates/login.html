<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Sign in', 'none', ~{:: main})}">
<body>

<main th:fragment="main" class="signin">
    <div class="signin__card card">
        <p class="label">Examination office</p>
        <h1 class="signin__title">Sign in</h1>
        <p class="signin__lead">Use the account the examination office issued you.</p>

        <form method="post" th:action="@{/login}" novalidate>
            <p class="field__error" th:if="${error}" th:text="${error}">Email or password is incorrect</p>
            <p class="notice" th:if="${notice}" th:text="${notice}">You have been signed out</p>

            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input mono" th:classappend="${error} ? 'input--error'"
                       type="email" id="email" name="email" autocomplete="username"
                       placeholder="name@example.edu" autofocus>
            </div>

            <div class="field">
                <label class="label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password"
                       autocomplete="current-password">
            </div>

            <button class="button button--full" type="submit">Sign in</button>
        </form>
    </div>
</main>

</body>
</html>
